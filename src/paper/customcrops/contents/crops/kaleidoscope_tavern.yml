# Managed by KaleidoscopeTavern. The plugin refreshes this file before
# CustomCrops loads so growth, bone meal, persistence and harvesting have one
# authoritative implementation. These crops are placed by API beneath mature
# trellises and intentionally do not use a pot whitelist.

kaleidoscope_tavern_grape:
  type: BLOCK
  pot-whitelist: []
  seed: kaleidoscope_tavern:_customcrops/grape_seed
  # Let the server owner's CustomCrops world tick mode select random or
  # scheduled growth. Tavern does not run a second crop-growth scheduler.
  ignore-random-tick: false
  ignore-scheduled-tick: false
  random-rotation: false
  max-points: 5
  points:
    0:
      model: kaleidoscope_tavern:grape_crop
    1:
      model: kaleidoscope_tavern:_crop/grape_crop/stage_1
    2:
      model: kaleidoscope_tavern:_crop/grape_crop/stage_2
    3:
      model: kaleidoscope_tavern:_crop/grape_crop/stage_3
    4:
      model: kaleidoscope_tavern:_crop/grape_crop/stage_4
    5:
      model: kaleidoscope_tavern:_crop/grape_crop/stage_5
      events:
        interact:
          harvest_with_shears:
            type: conditional
            value:
              conditions:
                shears:
                  type: item-in-hand
                  value:
                    item: SHEARS
                    amount: 1
              actions:
                # GrapeCropBlock#use: three grapes, a 30% 1-2 green grape
                # bonus, shear durability and the beehive shear sound. The
                # crop is removed WITHOUT firing the break event so the
                # mining loot below cannot double up.
                ripe_grapes:
                  type: drop-item
                  value:
                    ignore-fertilizer: true
                    item: kaleidoscope_tavern:grape
                    min: 3
                    max: 3
                green_grapes:
                  type: drop-item
                  value:
                    ignore-fertilizer: true
                    item: kaleidoscope_tavern:green_grape
                    min: 1
                    max: 2
                  chance: 0.3
                damage_shears:
                  type: durability
                  value: -1
                harvest_sound:
                  type: sound
                  value:
                    source: player
                    key: minecraft:block.beehive.shear
                    volume: 1
                    pitch: 1
                remove_crop:
                  type: break
                  value: false
                swing_hand:
                  type: swing-hand
                  value: true
        break:
          # BlockLootTables#createGrapeItemTable: mining a mature cluster with
          # any tool (shears included) drops 1-2 grapes plus a 30% chance of
          # one green grape.
          mined_grapes:
            type: drop-item
            value:
              ignore-fertilizer: true
              item: kaleidoscope_tavern:grape
              min: 1
              max: 2
          mined_green_grape:
            type: drop-item
            value:
              ignore-fertilizer: true
              item: kaleidoscope_tavern:green_grape
              min: 1
              max: 1
            chance: 0.3
  # GrowCondition entries are checked in order. 0.125 for +2 followed by
  # 1/7 for +1 yields the source distribution per CustomCrops tick:
  # 12.5% +2, 12.5% +1, 75% no growth. suitable-season also supplies the
  # native CustomCrops greenhouse exemption.
  grow-conditions:
    two_points:
      point: 2
      conditions:
        suitable_season:
          type: suitable-season
          value: [Summer, Autumn]
        growth_roll:
          type: random
          value: 0.125
    one_point:
      point: 1
      conditions:
        suitable_season:
          type: suitable-season
          value: [Summer, Autumn]
        growth_roll:
          type: random
          value: 0.142857142857
  custom-bone-meal:
    bone_meal:
      item: BONE_MEAL
      dispenser: true
      # BoneMeal#rollPoint takes the first successful entry in order, so
      # 50% roll +2 first and fall back to a guaranteed +1: the source's
      # uniform 1-2 points that never fails.
      chance:
        2: 0.5
        1: 1.0
      actions:
        swing_hand:
          type: swing-hand
          value: true
        particles:
          type: particle
          value:
            particle: VILLAGER_HAPPY
            x: 0.5
            y: 0.5
            z: 0.5
            count: 10
            offset-x: 0.25
            offset-y: 0.25
            offset-z: 0.25
        sound:
          type: sound
          value:
            source: player
            key: minecraft:item.bone_meal.use
            volume: 1
            pitch: 1

