    bone_meal:
      item: BONE_MEAL
      dispenser: true
      # BoneMeal#rollPoint takes the first successful entry in order, so
      # 50% roll +2 first and fall back to a guaranteed +1: the source's
      # uniform 1-2 points that never fails.
      chance:
        2: 0.5
        1: 1.0
      actions:
        swing_hand:
          type: swing-hand
          value: true
        particles:
          type: particle
          value:
            particle: VILLAGER_HAPPY
            x: 0.5
            y: 0.5
            z: 0.5
            count: 10
            offset-x: 0.25
            offset-y: 0.25
            offset-z: 0.25
        sound:
          type: sound
          value:
            source: player
            key: minecraft:item.bone_meal.use
            volume: 1
            pitch: 1

