            chance: 0.3
  # The first two entries provide the ordinary 25% distribution. In frozen
  # climates the two later entries are reached only after that 75% miss;
  # 11/30 and 11/19 then add 27.5% to each outcome, producing the source's
  # favored 40% +2, 40% +1, 20% no-growth distribution. CustomCrops 3.6.52
  # accepts integer temperature ranges, so -10~0 plus snowy_beach covers the
  # vanilla biomes below the source threshold of 0.15.
  grow-conditions:
    two_points:
      point: 2
      conditions:
        suitable_season:
          type: suitable-season
          value: [Winter]
        growth_roll:
          type: random
          value: 0.125
    one_point:
      point: 1
      conditions:
        suitable_season:
          type: suitable-season
          value: [Winter]
        growth_roll:
          type: random
          value: 0.142857142857
    favored_two_points:
      point: 2
      conditions:
        suitable_season:
          type: suitable-season
          value: [Winter]
        favored_climate:
          type: '||'
          value:
            frozen_temperature:
              type: temperature
              value: '-10~0'
            snowy_beach:
              type: biome
              value: minecraft:snowy_beach
        growth_roll:
          type: random
          value: 0.366666666667
    favored_one_point:
      point: 1
      conditions:
        suitable_season:
          type: suitable-season
          value: [Winter]
        favored_climate:
          type: '||'
          value:
            frozen_temperature:
              type: temperature
              value: '-10~0'
            snowy_beach:
              type: biome
              value: minecraft:snowy_beach
        growth_roll:
          type: random
          value: 0.578947368421
