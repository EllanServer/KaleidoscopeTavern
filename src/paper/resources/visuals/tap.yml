# 首次启动时复制到 plugins/KaleidoscopeTavern/visuals/tap.yml。
# 数据目录中的副本不会被插件升级覆盖；修改后执行 /kt reload。
# 可使用原生 water、lava、honey、obsidian-tear 粒子，或使用 #RRGGBB 自定义液体颜色。
config-version: 1

outputs:
  water: "water"
  lava: "lava"
  honey: "honey"
  dragon-breath: "obsidian-tear"
  # TODO: 等 Minecraft/Paper 提供原生红色或可着色的滴落液体粒子后，改回西瓜红。
  watermelon: "water"
