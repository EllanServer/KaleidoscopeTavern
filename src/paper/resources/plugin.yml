name: KaleidoscopeTavern
version: '${version}'
main: com.github.ysbbbbbb.kaleidoscopetavern.paper.KaleidoscopeTavernPlugin
description: Kaleidoscope Tavern rewritten for Paper 26.2 and CraftEngine.
api-version: '26.2'
authors: [ysbbbbbb, tartaric_acid]
website: https://github.com/EllanServer/KaleidoscopeTavern
depend: [CraftEngine, CustomCrops]
softdepend: [PlaceholderAPI, CustomNameplates]
commands:
  kaleidoscopetavern:
    description: Kaleidoscope Tavern command
    usage: /<command> <status|give|reload|recipes>
    aliases: [kt]
permissions:
  kaleidoscopetavern.admin:
    description: Allows administration of Kaleidoscope Tavern
    default: op
    children:
      kaleidoscopetavern.recipes: true
  kaleidoscopetavern.recipes:
    description: Allows viewing tavern recipes via /kt recipes
    default: true
