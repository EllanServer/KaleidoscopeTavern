# 首次启动时复制到 plugins/KaleidoscopeTavern/recipes/barrel.yml。
# 数据目录中的副本不会被插件升级覆盖；修改后执行 /kt reload。
# selector 支持 item=<命名空间:物品> 与 tag=<命名空间:标签>。
config-version: 1

# 满桶内容没有匹配 recipes 时生成的保底产物。
