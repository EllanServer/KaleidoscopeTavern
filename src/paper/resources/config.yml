pack:
  install-on-startup: true
  overwrite-managed-files: true

custom-crops:
  install-managed-config: true

stations:
  press-eject-invalid: true

# 自定义酒效 HUD 的渲染方式。
#   auto:     检测到 CustomNameplates 时停用内置 BossBar，改由外部通过
#             %kaleidoscopetavern_effect_hud% 占位符渲染；否则使用内置 BossBar。
#   builtin:  始终使用内置 BossBar。
#   external: 始终停用内置 BossBar，仅提供 PlaceholderAPI 占位符。
effect-hud:
  mode: auto

gameplay:
  infinite-lava-from-tap: true

bottle-placement:
  water: true
  honey: true
  potion: true
  dragon-breath: true
  experience: true

worldgen:
  wild-grapevines: true
  chunk-chance: 0.08
  max-chains-per-chunk: 5
  max-chain-length: 7

messages:
  prefix: '<dark_aqua>[森罗酒馆]</dark_aqua> '
  no-recipe: '<red>当前材料无法完成配方。</red>'
  station-busy: '<yellow>这个设备正在工作。</yellow>'
  pack-missing: '<red>CraftEngine 内容包尚未加载，请执行 /ce reload all。</red>'
  press-filled: '<green>压榨完成：<amount>/1000 mB。</green>'
  barrel-started: '<green>酒桶已开始酿造。</green>'
  barrel-progress: '<gray>当前陈酿等级：<level>/6。</gray>'
  barrel-not-brewing: '<gray>酿造尚未开始。</gray>'
  barrel-brewing-cannot-open: '<red>无法在酿造过程中打开酒桶！</red>'
  barrel-fluid-not-full: '<yellow>需要先把酒桶装满流体，才能添加原料！</yellow>'
  barrel-no-space: '<yellow>酒桶已满，无法添加更多原料！</yellow>'
  incense-on: '<green>香炉已点燃。</green>'
  incense-off: '<gray>香炉已熄灭。</gray>'
