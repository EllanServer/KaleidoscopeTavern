name: Paper 26.2 build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply queued shared-tint and facing patch
        if: github.event_name == 'pull_request' && hashFiles('.github/pr56-unified-facing.xz.part02') != ''
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          cat .github/pr56-unified-facing.xz.part* \
            | base64 --decode \
            | xz --decompress > /tmp/pr56-shared-tint-facing.patch
          echo "1cebd9ff4922ce937575e77761c4c3cdb5e02660ae00cd38c405bd6992f1411b  /tmp/pr56-shared-tint-facing.patch" \
            | sha256sum --check
          git apply --check --whitespace=nowarn /tmp/pr56-shared-tint-facing.patch
          git apply --index --whitespace=nowarn /tmp/pr56-shared-tint-facing.patch
          rm -f .github/pr56-unified-facing.xz.part*
          rm -f .github/pr56-shared-tint-facing.patch.gz.b64
          git show be460252f33b5e81fd5d798a3495af0bb38d4c76:.github/workflows/paper-26.2.yml \
            > .github/workflows/paper-26.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compress connected sofas and unify placement facing"
          git push origin HEAD:"${HEAD_BRANCH}"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, test and validate CraftEngine pack
        run: ./gradlew clean build --stacktrace

      - name: Audit deployable artifact
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'KaleidoscopeTavern-Paper-*.jar' ! -name '*-sources.jar')
          test "${#jars[@]}" -eq 1
          sha256sum "${jars[0]}"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: KaleidoscopeTavern-Paper-26.2
          path: |
            build/libs/KaleidoscopeTavern-Paper-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
