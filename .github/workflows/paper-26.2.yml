name: Paper 26.2 build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 2

      - name: Apply staged CI fix
        if: hashFiles('.github/pr56-ci-fix.patch') != ''
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          behavior = Path('src/paper/java/com/github/ysbbbbbb/kaleidoscopetavern/paper/game/block/StorageBlockBehavior.java')
          text = behavior.read_text(encoding='utf-8')
          old = '            player.sendActionBar(Component.translatable(translationKey));'
          new = '            ((org.bukkit.entity.Player) player.platformPlayer())\n                    .sendActionBar(Component.translatable(translationKey));'
          assert old in text
          text = text.replace(old, new, 1)
          old = '                        controller.config().viewRange()\n                                * player.displayEntityViewDistance(), metadata);'
          new = '                        (float) (controller.config().viewRange()\n                                * player.displayEntityViewDistance()), metadata);'
          assert old in text
          behavior.write_text(text.replace(old, new, 1), encoding='utf-8')

          config = Path('src/paper/java/com/github/ysbbbbbb/kaleidoscopetavern/paper/game/block/StorageBlockConfig.java')
          text = config.read_text(encoding='utf-8')
          old = '            return sample(random, minimum, maximum);'
          new = '            return StorageBlockConfig.sample(random, minimum, maximum);'
          assert old in text
          config.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/pr56-ci-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix config-driven storage CI compilation"
          git push origin HEAD:"${HEAD_BRANCH}"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, test and validate CraftEngine pack
        run: ./gradlew clean build --stacktrace

      - name: Audit deployable artifact
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'KaleidoscopeTavern-Paper-*.jar' ! -name '*-sources.jar')
          test "${#jars[@]}" -eq 1
          sha256sum "${jars[0]}"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: KaleidoscopeTavern-Paper-26.2
          path: |
            build/libs/KaleidoscopeTavern-Paper-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
