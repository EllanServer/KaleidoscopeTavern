name: Paper 26.2 build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply queued CE-configuration refactor
        if: github.event_name == 'pull_request' && hashFiles('.github/ce-config-refactor.patch') != ''
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          git apply --whitespace=nowarn .github/ce-config-refactor.patch
          rm .github/ce-config-refactor.patch
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- .github/workflows/paper-26.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move CE-supported behavior back to configuration"
          git push origin HEAD:"${HEAD_BRANCH}"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, test and validate CraftEngine pack
        run: ./gradlew clean build --stacktrace

      - name: Audit deployable artifact
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'KaleidoscopeTavern-Paper-*.jar' ! -name '*-sources.jar')
          test "${#jars[@]}" -eq 1
          sha256sum "${jars[0]}"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: KaleidoscopeTavern-Paper-26.2
          path: |
            build/libs/KaleidoscopeTavern-Paper-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
